          - "Nadie habla en la retro": situaciones/retro-en-silencio.md
          - "Las retros se repiten y nada cambia": situaciones/retro-sin-cambios.md
          - "La review es una demo sin stakeholders ni feedback": situaciones/review-sin-stakeholders.md
