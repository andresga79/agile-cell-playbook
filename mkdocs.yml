site_name: Agile Cell Playbook
site_description: Metodología para crear o tomar una célula ágil y entregar valor de negocio con mirada de flujo
site_author: Andres Gonzalez
site_url: https://andresga79.github.io/agile-cell-playbook/
repo_url: https://github.com/andresga79/agile-cell-playbook
repo_name: andresga79/agile-cell-playbook
edit_uri: edit/main/docs/
copyright: Agile Cell Playbook · versionado en GitHub

theme:
  name: material
  language: es
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: es
  - git-revision-date-localized:
      type: date
      locale: es
      fallback_to_build_date: true
      strict: false   # archivos aún sin commit no deben romper el build estricto
  - print-site:
      add_to_navigation: true
      print_page_title: Versión imprimible
      add_print_site_banner: true
      print_site_banner_template: includes/print-banner.tpl
      add_table_of_contents: true
      toc_title: Contenido
      add_cover_page: true
      enumerate_headings: false
      enumerate_figures: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - abbr
  - pymdownx.snippets:
      auto_append:
        - includes/abreviaturas.md
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - assets/css/assessment.css

hooks:
  - hooks/assessment_data.py

nav:
  - Inicio: index.md
  - Cómo usar la guía: como-usar.md
  - Fases:
      - fases/index.md
      - "0 · Diagnóstico y onboarding": fases/00-diagnostico-onboarding.md
      - "1 · Descubrimiento de producto": fases/01-descubrimiento.md
      - "2 · Fundaciones técnicas": fases/02-fundaciones-tecnicas.md
      - "3 · Diseño del sistema de trabajo": fases/03-sistema-de-trabajo.md
      - "4 · Entrega continua de valor": fases/04-entrega-continua.md
      - "5 · Medición y aprendizaje": fases/05-medicion.md
      - "6 · Mejora, innovación y escalamiento": fases/06-mejora-innovacion.md
      - "Transversal · Gobierno con proveedores": fases/transversal-gobierno-proveedores.md
      - "Transversal · Traspaso a equipo interno": fases/transversal-traspaso-proveedor.md
      - "Transversal · IA en la célula": fases/transversal-ia-en-la-celula.md
  - Caja de herramientas:
      - caja-de-herramientas/index.md
      - Mapa de stakeholders: caja-de-herramientas/mapa-stakeholders.md
      - Assessment de madurez: caja-de-herramientas/assessment-madurez.md
      - Calculadora de madurez: caja-de-herramientas/calculadora-madurez.md
      - Team Canvas: caja-de-herramientas/team-canvas.md
      - Delegation Board: caja-de-herramientas/delegation-board.md
      - Acuerdos de trabajo distribuido: caja-de-herramientas/acuerdos-trabajo-distribuido.md
      - Plan de onboarding y offboarding: caja-de-herramientas/plan-onboarding.md
      - Lean Canvas e hipótesis: caja-de-herramientas/lean-canvas-hipotesis.md
      - Cost of Delay y WSJF: caja-de-herramientas/cost-of-delay-wsjf.md
      - User Story Map: caja-de-herramientas/user-story-map.md
      - Roadmap por outcomes: caja-de-herramientas/roadmap-outcomes.md
      - ADR: caja-de-herramientas/adr.md
      - Seguridad en el flujo: caja-de-herramientas/seguridad-en-el-flujo.md
      - DoR y DoD: caja-de-herramientas/dor-dod.md
      - Políticas del tablero: caja-de-herramientas/politicas-tablero.md
      - Calendario de cadencias: caja-de-herramientas/calendario-cadencias.md
      - Checklist de paso a producción: caja-de-herramientas/checklist-produccion.md
      - Catálogo de métricas: caja-de-herramientas/catalogo-metricas.md
      - Pronóstico Monte Carlo: caja-de-herramientas/pronostico-monte-carlo.md
      - Retrospectiva basada en datos: caja-de-herramientas/retro-datos.md
      - Value Stream Mapping: caja-de-herramientas/value-stream-map.md
      - Tablero de dependencias: caja-de-herramientas/tablero-dependencias.md
      - Plan de traspaso: caja-de-herramientas/plan-traspaso.md
  - Casos de ejemplo:
      - casos/index.md
      - Crear una célula: casos/crear-celula.md
      - Tomar una célula: casos/tomar-celula.md
      - Traspaso de proveedor: casos/traspaso-proveedor.md
  - Glosario: glosario.md
  - Versiones: versiones.md
  - Changelog: changelog.md
  - Contribuir: contribuir.md
