site_name: Agile Cell Playbook
site_description: Metodología para crear o tomar una célula ágil y entregar valor de negocio con mirada de flujo
site_author: Andres Gonzalez
site_url: https://andresga79.github.io/agile-cell-playbook/
repo_url: https://github.com/andresga79/agile-cell-playbook
repo_name: andresga79/agile-cell-playbook
edit_uri: edit/main/docs/
copyright: Agile Cell Playbook · versionado en GitHub

theme:
  name: material
  language: es
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: es
  - git-revision-date-localized:
      type: date
      locale: es
      fallback_to_build_date: true
      strict: false   # archivos aún sin commit no deben romper el build estricto
  # print-site genera la página en /print_page/ en tiempo de build, fuera de
  # docs/, así que no se puede enlazar como .md. docs/como-usar.md la enlaza a
  # mano con ../print_page/, que supone use_directory_urls: true (el valor por
  # defecto). Si se cambia esa opción, actualizar ese enlace. El build lo
  # informa como INFO (enlace no reconocido), no como advertencia.
  - print-site:
      add_to_navigation: true
      print_page_title: Versión imprimible
      add_print_site_banner: true
      print_site_banner_template: includes/print-banner.tpl
      add_table_of_contents: true
      toc_title: Contenido
      add_cover_page: true
      enumerate_headings: false
      enumerate_figures: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - abbr
  - pymdownx.snippets:
      auto_append:
        - includes/abreviaturas.md
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - assets/css/assessment.css

# Los scripts de las herramientas se cargan en todas las páginas y solo se
# activan si encuentran su contenedor (#assessment-app, #montecarlo-app).
extra_javascript:
  - assets/js/assessment.js
  - assets/js/montecarlo.js

hooks:
  - hooks/assessment_data.py
  - hooks/fichas.py

